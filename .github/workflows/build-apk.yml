# Builds the APK on a runner that has the Android SDK, which the sandbox this
# repo is edited from does not. Produces a downloadable artifact rather than
# committing a binary back into the repository.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Consider pinning these to full commit SHAs if you want the workflow
      # itself to be tamper-evident; tags can be moved by the action's owner.
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Checks gradle-wrapper.jar against Gradle's published checksums, so the
      # committed binary cannot be swapped for a modified one unnoticed.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # A malformed manifest or resource only surfaces a minute into Gradle
      # configuration, so check well-formedness up front where it costs nothing.
      - name: Validate XML resources
        run: |
          python3 - <<'PY'
          import glob, sys, xml.dom.minidom as md
          bad = []
          for path in sorted(glob.glob('app/src/**/*.xml', recursive=True)):
              try:
                  md.parse(path)
              except Exception as exc:
                  bad.append(f"{path}: {exc}")
          for line in bad:
              print(f"malformed: {line}")
          print(f"checked {len(glob.glob('app/src/**/*.xml', recursive=True))} files, {len(bad)} malformed")
          sys.exit(1 if bad else 0)
          PY

      - name: Assemble release
        run: ./gradlew --no-daemon assembleRelease

      - name: Android lint
        continue-on-error: true
        run: ./gradlew --no-daemon lintRelease

      # Signing runs only if a keystore has been added to repository secrets.
      # Without it the job still produces an unsigned APK.
      - name: Check for signing material
        id: signing
        run: echo "available=${{ secrets.KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

      - name: Sign release APK
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/signing.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          zipalign=$(find "$ANDROID_SDK_ROOT/build-tools" -name zipalign | sort -V | tail -1)
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          "$zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out app/build/outputs/apk/release/FloatingTranslator-signed.apk \
            "$RUNNER_TEMP/aligned.apk"
          rm -f "$keystore"
          "$apksigner" verify --print-certs \
            app/build/outputs/apk/release/FloatingTranslator-signed.apk

      - name: Report APK identity
        run: |
          set -euo pipefail
          echo "### APK build" >> "$GITHUB_STEP_SUMMARY"
          for f in app/build/outputs/apk/release/*.apk; do
            echo "- \`$(basename "$f")\` — $(du -h "$f" | cut -f1) — sha256 \`$(sha256sum "$f" | cut -d' ' -f1)\`" \
              >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: floating-translator-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
