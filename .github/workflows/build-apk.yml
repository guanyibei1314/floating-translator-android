# Builds the APK on a runner that has the Android SDK, which the sandbox this
# repo is edited from does not. Produces a downloadable artifact rather than
# committing a binary back into the repository.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Consider pinning these to full commit SHAs if you want the workflow
      # itself to be tamper-evident; tags can be moved by the action's owner.
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Checks gradle-wrapper.jar against Gradle's published checksums, so the
      # committed binary cannot be swapped for a modified one unnoticed.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # A malformed manifest or resource only surfaces a minute into Gradle
      # configuration, so check well-formedness up front where it costs nothing.
      - name: Validate XML resources
        run: |
          python3 - <<'PY'
          import glob, sys, xml.dom.minidom as md
          paths = sorted(glob.glob('app/src/**/*.xml', recursive=True))
          bad = []
          for path in paths:
              try:
                  md.parse(path)
              except Exception as exc:
                  bad.append(f"{path}: {exc}")
          for line in bad:
              print(f"malformed: {line}")
          print(f"checked {len(paths)} files, {len(bad)} malformed")
          sys.exit(1 if bad else 0)
          PY

      # Decodes the keystore when one has been added to repository secrets.
      # The check is done in the shell rather than in an `if:` condition,
      # because the secrets context is not available to step conditions and
      # using it there makes the whole workflow file invalid.
      - name: Prepare signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No keystore secret configured; the release APK will be unsigned."
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "Signing material decoded."

      # Gradle signs during packaging when KEYSTORE_PATH and the passwords are
      # set; otherwise it emits app-release-unsigned.apk.
      - name: Assemble release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Android lint
        continue-on-error: true
        run: ./gradlew --no-daemon lintRelease

      - name: Report APK identity
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          {
            echo "### APK build"
            for f in app/build/outputs/apk/release/*.apk; do
              echo "- \`$(basename "$f")\` — $(du -h "$f" | cut -f1) — sha256 \`$(sha256sum "$f" | cut -d' ' -f1)\`"
              if "$apksigner" verify --print-certs "$f" > /tmp/certs.txt 2>/dev/null; then
                echo "  - signed; $(grep -m1 'SHA-256 digest' /tmp/certs.txt || echo 'certificate details in log')"
              else
                echo "  - **unsigned** — cannot be installed until it is signed"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/*.apk || true

      - uses: actions/upload-artifact@v4
        with:
          name: floating-translator-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
